name: Build and release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: temurin

      # The base mod jar is not redistributed here, so CI fetches the newest 1.21.1 NeoForge build
      # from Modrinth and files it under the name gradle.properties expects.
      - name: Fetch Kaleidoscope Cookery
        run: |
          set -euo pipefail
          mkdir -p libs
          PROJECT=kaleidoscope-cookery
          TARGET="libs/kaleidoscopecookery-$(grep '^deps.kaleidoscope_cookery=' gradle.properties | cut -d= -f2).jar"
          URL=$(curl -sSL "https://api.modrinth.com/v2/project/${PROJECT}/version?loaders=%5B%22neoforge%22%5D&game_versions=%5B%221.21.1%22%5D" \
            | python3 -c "import sys,json; v=json.load(sys.stdin)[0]; print(v['files'][0]['url'])")
          echo "fetching $URL"
          curl -sSL -o "$TARGET" "$URL"
          ls -l libs

      - name: Build
        run: |
          chmod +x ./gradlew
          ./gradlew build --no-daemon

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: kaleidoscope-kitchenware
          path: build/libs/*.jar
          if-no-files-found: error

      # Summarised notes rather than a commit dump: the environment block is generated because it
      # changes with every release, and the changes are grouped so a reader sees what happened
      # instead of a wall of hashes.
      - name: Compose release notes
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          PREV=$(git tag --sort=-v:refname | grep -v "^${GITHUB_REF_NAME}$" | head -n 1 || true)
          RANGE="${PREV:+$PREV..}${GITHUB_REF_NAME}"
          MOD_VERSION=$(grep '^mod.version=' gradle.properties | cut -d= -f2)
          NEO_VERSION=$(grep '^mod.neo_version=' gradle.properties | cut -d= -f2)
          COOKERY_VERSION=$(grep '^deps.kaleidoscope_cookery=' gradle.properties | cut -d= -f2)

          added=$(git log --no-merges --pretty='- %s' "$RANGE" | grep -E '^- (feat|refactor)' || true)
          fixed=$(git log --no-merges --pretty='- %s' "$RANGE" | grep -E '^- fix' || true)
          other=$(git log --no-merges --pretty='- %s' "$RANGE" | grep -Ev '^- (feat|fix|refactor)' || true)

          {
            echo "## 中文"
            echo
            [ -n "$added" ]   && { echo "### 新增"; echo; echo "$added"; echo; }
            [ -n "$fixed" ]   && { echo "### 修复"; echo; echo "$fixed"; echo; }
            [ -n "$other" ]   && { echo "### 其他"; echo; echo "$other"; echo; }
            echo "### 环境要求"; echo
            echo "| 项 | 版本 |"; echo "| --- | --- |"
            echo "| Minecraft | 1.21.1 |"
            echo "| NeoForge | ${NEO_VERSION} 及以上 |"
            echo "| 森罗物语：厨房 | \`${COOKERY_VERSION}\` 及以上（必需前置） |"
            echo
            echo "---"
            echo
            echo "## English"
            echo
            [ -n "$added" ]   && { echo "### Added"; echo; echo "$added"; echo; }
            [ -n "$fixed" ]   && { echo "### Fixed"; echo; echo "$fixed"; echo; }
            [ -n "$other" ]   && { echo "### Other"; echo; echo "$other"; echo; }
            echo "### Requirements"; echo
            echo "| Item | Version |"; echo "| --- | --- |"
            echo "| Minecraft | 1.21.1 |"
            echo "| NeoForge | ${NEO_VERSION} or above |"
            echo "| Kaleidoscope Cookery | \`${COOKERY_VERSION}\` or above (required) |"
            echo
            echo "**Full changelog**: https://github.com/${GITHUB_REPOSITORY}/commits/${GITHUB_REF_NAME}"
          } > release-notes.md
          cat release-notes.md

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/*.jar
          body_path: release-notes.md
